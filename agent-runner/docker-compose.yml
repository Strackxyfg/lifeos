# LifeOS Agent Runner — VPS deployment.
#
# Hardened by default: read-only filesystem, no new privileges, all Linux
# capabilities dropped, memory and CPU capped. The container holds no database
# or Notion credentials — only a scoped, revocable LifeOS token.
services:
  agent:
    build: .
    restart: unless-stopped
    env_file: .env

    # ── Reaching a local Hermes (AGENT_BACKEND=hermes) ───────────────
    # Hermes' API server binds to 127.0.0.1 on the host, which inside a
    # container means the container itself. Uncomment to share the host's
    # network namespace so http://127.0.0.1:8642 resolves to Hermes.
    #
    # Preferred over binding Hermes to 0.0.0.0: on a public VPS that would put
    # an unauthenticated-by-default agent API on the open internet, one
    # firewall mistake away from disaster. The container still listens on
    # nothing and keeps every hardening flag below.
    #
    # network_mode: host

    # ── Isolation ────────────────────────────────────────────────────
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"

    # ── Blast radius ─────────────────────────────────────────────────
    mem_limit: 256m
    pids_limit: 128
    cpus: 0.5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
